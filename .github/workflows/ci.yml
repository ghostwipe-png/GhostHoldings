name: GhostHoldings CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Entire Solution
      # Builds ALL projects (including Tests) in Release mode
      run: dotnet build --configuration Release --no-restore

    - name: Run Tests
      # No --no-build flag, and no specific project path. Let .NET handle it natively.
      run: dotnet test --configuration Release

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -t ghostholdings-api .