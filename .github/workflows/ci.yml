name: GhostHoldings CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Build and Run Unit Tests
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Backend
      run: dotnet build GhostHoldings.Api --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test GhostHoldings.Tests --no-build --verbosity normal

  # JOB 2: Validate Docker Build (Only runs if Job 1 passes)
  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -t ghostholdings-api .